name: tests

# Runs ruff and the pytest suite on every pull request, and on main when the pipeline code or the tests change. The cloud run uses
# whatever is on main at each scheduled run, so a red run here means fix it before the next one.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'ruff.toml'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.6 pytest==9.* pyyaml==6.0.3
      - run: ruff check scripts tests
      - run: python -m pytest -q tests
