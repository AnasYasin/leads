name: tests

# Runs the pytest suite whenever the pipeline code or the tests change. The cloud run uses
# whatever is on main at each scheduled run, so a red run here means fix it before the next one.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.* pyyaml==6.0.3
      - run: python -m pytest -q tests
