name: Deliver shortlist

# The radar agent pushes a new file into shortlists/. This rebuilds reports/LATEST.md so it holds
# the newest two runs. The repository is the store: shortlists/, jobs/ and companies/ grow with
# every run. Email over Gmail is an extra and runs only when the two secrets exist.

on:
  push:
    branches: [main]
    paths:
      - 'shortlists/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deliver
  cancel-in-progress: false

env:
  GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      # History is needed to tell a first send from a re-render (scripts/correction.py).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Rebuild reports/LATEST.md
        id: build
        run: echo "newest=$(python3 scripts/build_latest.py)" >> "$GITHUB_OUTPUT"

      # reports/LATEST.md is bookkeeping. It must never be able to stop the delivery, which is the
      # only thing this workflow exists to do. On 26 August 2026 evening this step's `git push` lost
      # a race with a concurrent run, the step failed, and the delivery was skipped, so that
      # evening's shortlist (3 new jobs) never went out and never could, because those jobs were
      # already in state/seen.json. Hence the rebase-and-retry below and `continue-on-error`.
      - name: Commit reports/LATEST.md if it changed
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain reports/LATEST.md)" ]; then
            echo "reports/LATEST.md unchanged"
            exit 0
          fi
          git config user.name "job-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/LATEST.md
          git commit -m "Roll reports/LATEST.md to the newest two runs [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing and retrying ($i/3)"
            git pull --rebase origin main || break
            sleep $((i * 3))
          done
          echo "could not push reports/LATEST.md; the delivery still goes out"
          exit 1

      # 29 Sep 2026: the morning run pushed "7 new" and then "9 new (corrected)", and both went out
      # in full. A shortlist that was committed before has been delivered before, so a re-render
      # delivers only what changed. Never allowed to stop the delivery: on any error the full
      # shortlist goes out as before.
      - name: Is this a re-render of a delivered run
        id: corr
        if: always() && steps.build.outputs.newest != ''
        continue-on-error: true
        env:
          NEWEST: ${{ steps.build.outputs.newest }}
        run: echo "path=$(python3 scripts/correction.py "$NEWEST" || true)" >> "$GITHUB_OUTPUT"

      # The store, downloadable without a laptop: store/jobs.db rebuilt from the repository and
      # attached to the one release named `store`, replaced on every run. Never stops the rest.
      - name: Publish the store
        if: always() && steps.build.outputs.newest != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/store.py
          gh release view store > /dev/null 2>&1 || gh release create store --title "The store" --notes "store/jobs.db, rebuilt after every run by scripts/store.py. Download and open with any SQLite tool."
          gh release upload store store/jobs.db --clobber

      # Optional, only when the two Gmail secrets are set (docs/DEPLOY.md).
      - name: Email the newest run
        if: always() && steps.build.outputs.newest != '' && env.GMAIL_ADDRESS != ''
        env:
          NEWEST: ${{ steps.build.outputs.newest }}
          CORRECTION: ${{ steps.corr.outputs.path }}
        run: |
          if [ -n "$CORRECTION" ] && [ -f "$CORRECTION" ]; then
            python3 scripts/send_mail.py --raw "$CORRECTION"
          else
            python3 scripts/send_mail.py "$NEWEST"
          fi
