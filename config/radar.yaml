# Job radar configuration. Every profile fact, search term, title filter and ranking weight the
# scripts use lives here, so the radar can be pointed at another person or another kind of job by
# editing this file only. PROFILE.md stays the prose guide the agent scores with.
#
# Patterns are regular expressions, matched case-insensitively. A list of patterns means "any of
# these" (they are joined with |). The history of why each term is here is in the git log of the
# script that used to hold it (scripts/filter_run.py, scripts/prescore.py, scripts/collect_*.py).
# Moved here on 29 Sep 2026.

# Who the radar searches for. referral_companies skip the seniority and not-wanted title filters.
# applied_companies are checked together with applications.md.
profile:
  # Filled by the setup session (SETUP.md). Patterns are regular expressions, case-insensitive.
  name: ""
  guide: PROFILE.md
  # Companies where the candidate has a personal contact. Their rows skip the seniority and
  # not-wanted title filters and are sent first. Empty list when there is none.
  referral_companies: []
  # Companies applied to before applications.md existed. Usually empty for a new setup.
  applied_companies: []

# What each collector asks each job board for. Filled by the setup session from the target roles.
# Every list must have at least one entry before the first run.
search:
  linkedin:
    roles: []
    places: []
    # Extra queries with their own time window in hours, for a referral company. Empty when none.
    targets: []
  bundesagentur:
    queries: []
    # '' means nationwide.
    places: []
  xing:
    queries: []
    places: []
    pages: 8
  stepstone:
    roles: []
    cities: []
  talent:
    roles: []
    cities: []
  getro:
    # VC portfolio job boards, by Getro collection id. The defaults are German funds.
    collections:
    - id: 1680
      name: Point Nine
    - id: 617
      name: Earlybird
    - id: 44081
      name: Cherry Ventures
    - id: 234
      name: HV Capital
    - id: 9233
      name: Merantix AI Campus

