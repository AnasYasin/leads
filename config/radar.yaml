# How a run reads (added 30 Sep 2026). The point of the radar is applying to a job in the field while
# its pool of applicants is still small, so the freshest jobs are read first and none of them is left.
reading:
  # Read order groups: jobs posted within the first number of days, then within the second, then the
  # rest. Inside a group, the prescore decides.
  fresh_first_days:
  - 1
  - 3
  # A candidate posted this many days ago or less must be read in the same run. fresh_check.py lists
  # any that were not, and the email shows them under "Fresh, not read yet".
  must_read_days: 2
  # scripts/read_next.py. A batch is printed whole in one tool result, so it must stay under the size
  # at which the tool shortens its output. Reading stops this many minutes after collection started.
  batch_chars: 20000
  batch_jobs: 6
  stop_minutes: 80
